<!doctype html><html><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<link rel='stylesheet' href='assets/styles.css'>
<title>Min's Mudae Sorter v0.4</title></head><body>
<div class='container'>
<h1>✨ Min's Mudae Sorter ✨</h1>
<p>Choose the character you prefer.</p>
<div class='progress'><div id='fill'></div></div>
<p id='progressText'>0%</p>
<div class='cards'>
<div class='card' id='leftCard'></div>
<div class='vs'>VS</div>
<div class='card' id='rightCard'></div>
</div>
<div class='buttons'>
<button id='leftBtn'>⬅ LEFT</button>
<button id='tieBtn'>🤝 TIE</button>
<button id='rightBtn'>RIGHT ➡</button>
<button id='skipBtn'>⏭ SKIP</button>
</div>
<p id='status'></p>
</div>
<script src='js/sorter.js'></script><script src='js/ui.js'></script><script src='js/app.js'></script>
</body></html>
